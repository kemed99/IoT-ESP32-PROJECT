[package]
name = "iot"
version = "0.1.0"
authors = ["Zhafran"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "iot"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
ws2812-esp32-rmt-driver = { version = "0.14", features = ["smart-leds-trait"] }
smart-leds = "0.4"

log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync", "embedded-storage"] }
esp-idf-hal = "0.46"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }

embedded-io = "0.7"

[build-dependencies]
embuild = "0.33"




[[bin]]
name = "iot_rgb"
path = "src/main_rgb.rs"
harness = false

[[bin]]
name = "iot_white"
path = "src/main_white.rs"
harness = false
